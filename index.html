<!doctype html>
<html lang="en" data-brand="stripe" data-theme="brand">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webhook Chaos</title>
    <meta
      name="description"
      content="Chaos-test Stripe webhooks for duplicates, reordering, forged signatures, and stale timestamps. Debug failed signature verification in your browser."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23635bff'/><text x='16' y='22' text-anchor='middle' font-size='16' fill='white'>⚡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var brand = 'stripe'
        var themes = ['brand','expressive','vibrant','ocean','sunset','forest']
        var theme = localStorage.getItem('wc:colorTheme')
        if (themes.indexOf(theme) < 0) theme = 'brand'
        var mode = localStorage.getItem('wc:themeMode')
        if (mode !== 'light' && mode !== 'dark') mode = 'light'
        document.documentElement.dataset.brand = brand
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.themeMode = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
